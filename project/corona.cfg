# ============================================================
# 太阳外焰参数（corona.cfg）
#
# 改完保存，在窗口里按 F5 立即生效：不用重新编译，也不用关窗口。
# 格式：key = value      # 井号后面是注释
# 不写某一行 = 使用内置默认值；未知的键会被忽略。
# 方括号里是可调范围，超出会被钳制。
#
# 这一版是照着"细亮边 + 短火舌 + 细密日面"调的结构，
# 不再是早期的大花瓣。想要更含蓄就往文件末尾那组靠。
# ============================================================

# ---------- 主火舌层：白热亮边 + 短火舌 ----------
flameScale = 1.30        # 尺寸（×太阳半径），别低于 1.15，否则亮边会被日面吃掉 [0.9, 4]
flameAlpha = 0.90        # 整体亮度 [0, 2]
flameSpin  = 6.0         # 自转速度（度/秒）[-30, 30]

# ---------- 外层流焰：同一套贴图，但没有亮边 ----------
wispScale  = 1.55        # 比主火舌大，火舌落在外圈 [0.9, 5]
wispAlpha  = 0.14        # 只加一点流动感，太大会重新变成花瓣 [0, 1]
wispSpin   = -3.0        # 反向转，和主火舌错开 [-30, 30]

# ---------- 外围辉光 ----------
haloScale  = 2.30        # 辉光半径 [0.9, 8]
haloAlpha  = 0.32        # 辉光亮度 [0, 1.5]

# ---------- 动画幅度 ----------
pulse     = 0.020        # 呼吸缩放 [0, 0.5]
flicker   = 0.040        # 主火舌 alpha 闪烁 [0, 0.5]
haloPulse = 0.080        # 辉光脉动 [0, 0.5]

# ---------- 火舌形状（改了会重建纹理） ----------
rimWeight    = 0.95      # 白热亮环强度，0 = 没有亮边 [0, 2.5]
tongueWeight = 1.50      # 火舌亮度 [0, 4]
stripePower  = 1.7       # 火舌粗细：越大越细、暗隙越宽 [1, 10]
flameFreq    = 12        # 火舌数量：越大越密 [4, 64]
reachBase    = 0.88      # 火舌长度（贴图半径比例，1.0 = 公告板边缘）[0.82, 0.95]
reachRange   = 0.08      # 火舌长短的随机起伏 [0, 0.15]
glowFalloff  = 1.6       # 辉光衰减指数：越大光晕收得越紧 [0.5, 8]

