# ============================================================
# 场景参数（scene.cfg）
#
# 改完保存，在窗口里按 F5 立即生效：不用重新编译，也不用关窗口。
# 格式：key = value        # 井号后面是注释
# 颜色写三个数：key = r g b
# 不写某一行 = 使用内置默认值；未知的键会被忽略；方括号里是可调范围。
#
# 行星的半径、自转速度、轴倾角、贴图文件名不在这里——
# 那些是"天体本身的属性"，在 src/scene/scene.cpp 的 configureBodies() 里。
# 这个文件管的是"怎么摆、怎么画"。
# ============================================================


# ---------- 构图 ----------
# 行星间距整体缩放：只放大轨道半径，行星自身尺寸不变，
# 所以调大之后行星之间的"表面间隙"是同比变大的。等价于窗口里按 [ ] 键。
spacing = 1.0            # [0.8, 2.0]

# 全局视角的基准距离；实际距离 = 这个值 × spacing
overviewDistance = 64    # [20, 160]


# ---------- 土星环的影子 ----------
# 环投在行星上的影子强度倍数，0 = 关掉（方便对比）
ringShadowStrength = 1.0 # [0, 2]

# 影子边界的软边宽度，单位是**屏幕像素**（不是环宽的比例）。
# 2.5 是实测出来的甜点：再小会露出锯齿，再大就开始发糊。
# 下限其实由球面细分决定 —— 边界折线的顶点在屏幕上约 1.5 像素一个，
# 软边窄于这个间距就没法被顶点采到，锯齿会原样透出来。
# 内部还会按太阳高度角自动放大（太阳贴近环面时约 1/sinθ 倍），
# 所以不管土星转到哪、相机拉多近，边界的软硬在屏幕上看起来是一样的。
ringShadowFeather = 2.5 # [0.25, 4]

# 阴影球面的细分倍数：1 = 和行星本体一样粗，4 = 默认，8 = 最细（顶点数按平方增长）
# 锯齿已经交给上面的 feather 了；这个键只影响边界折线的棱角和帧率。
# 想让软边再收窄的话，得先把这个值提上去，否则会先撞上"顶点不够"的天花板
ringShadowSubdiv = 8     # [1, 8]


# ---------- 小行星带（火星-木星之间） ----------
asteroidCount = 900      # 点数上限 2000 [0, 2000]

# 演示间距下的半径区间（和 spacing 相乘）
asteroidDemoInner = 12.9
asteroidDemoOuter = 14.3

# 真实间距下的半长轴区间，单位 AU（真实主带 2.1~3.3）
asteroidAuInner = 2.1
asteroidAuOuter = 3.3

# 偏暖灰 = 岩石质。亮度压得比较低，避免抢戏
asteroidColor = 0.30 0.28 0.24
asteroidPointSize = 1.5  # [0.5, 6]


# ---------- 柯伊伯带（海王星外侧） ----------
kuiperCount = 1400       # 点数上限 2400 [0, 2400]
kuiperDemoInner = 34
kuiperDemoOuter = 41
kuiperAuInner = 33
kuiperAuOuter = 45

# 偏冷蓝 = 冰质
kuiperColor = 0.42 0.46 0.52
kuiperPointSize = 1.5


# ---------- 光照与雾 ----------
# 全局环境光：太空没有补光，纯物理会让行星暗面死黑；
# 这个值决定"暗面有多亮"，调大会削弱明暗对比
ambient = 0.40 0.42 0.54

# 线性雾的起止距离。默认起点 90 比整个太阳系还远，
# 所以雾只作用于远处的星空，行星不受影响
fogStart = 90
fogEnd = 380


# ---------- 轨道形状（这一组决定"像不像真太阳系"） ----------
# 偏心率缩放：1 = 真实椭圆。水星 0.206、火星 0.093，椭圆一眼就能看出来；
# 0 = 全部画成正圆（老版本的观感）
orbitEccentricity = 1.0  # [0, 1]

# 倾角缩放：1 = 真实倾角（相对黄道，最大是水星 7°、金星 3.4°）；
# 0 = 全部压成共面。放大到 3 倍可以夸张地演示"轨道并不共面"
orbitInclination = 1.0   # [0, 3]

# 公转角速度模式：1 = 开普勒第三定律 T ∝ a^1.5（海王星慢到几乎不动），
# 0 = 用手调的演示速度。这是"真实周期"和"看得舒服"之间唯一的开关
keplerPeriods = 0        # 0 或 1


# ---------- 真实比例模式（窗口里按 L） ----------
# 距离：r = 偏移 + 缩放 × 半长轴(AU)。偏移保持 0 就是"严格成比例"，
# 这时水星:地球:海王星 = 0.39:1:30，和真实完全一致
realOrbitOffset = 0.0    # [0, 60]
realOrbitScale = 2.0     # [0.05, 5]，2.0 时海王星落在 60.1

# 尺寸：以"地球的显示半径"为基准，其余行星按真实半径比例换算。
# 真实比例下木星是地球的 11 倍、水星 0.38 倍，这个比例是真的
realEarthRadius = 0.02   # [0.002, 0.3]

# 太阳显示半径的上限（× 水星轨道半径）。
# 真值是地球的 109 倍，按真值画会正好吞掉水星轨道，所以压到这个比例以内
realSunLimit = 0.18      # [0.02, 1]


# ============================================================
# 几组现成的组合（用的时候把注释去掉）
# ============================================================

# 想看清"内行星挤成一团"：把间距压到最小
# spacing = 0.8

# 想要开阔的构图：拉开 1.6 倍，相机自动跟到 99
# spacing = 1.6

# 只想看行星本身、不要小天体带
# asteroidCount = 0
# kuiperCount = 0

# 想看环影的边界质量差异：把软边从"刚好抗锯齿"调到"明显发糊"
# ringShadowFeather = 0.5   # 硬边，锯齿回来
# ringShadowFeather = 4.0   # 糊成一层雾

# 暗面更暗、明暗交界更硬（更"物理"、也更难看）
# ambient = 0.20 0.21 0.26

# 最"真实"的一组：椭圆轨道 + 真实周期（再按 L 切到真实比例）
# 注意真实周期下海王星几乎不动、水星 2.9 秒一圈，这是真值不是 bug
# orbitEccentricity = 1.0
# orbitInclination = 1.0
# keplerPeriods = 1

# 想看清"轨道不共面"：把倾角夸大到 3 倍
# orbitInclination = 3.0
